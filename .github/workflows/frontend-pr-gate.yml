name: Frontend PR Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: frontend-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  image-build:
    name: Frontend image build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          provenance: false
          build-args: |
            NEXT_PUBLIC_KAKAO_MAP_JS_KEY=ci-placeholder
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  frontend-ci-gate:
    name: frontend-ci-gate
    if: always()
    needs: [checks, image-build]
    runs-on: ubuntu-latest
    steps:
      - name: Require both checks
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          IMAGE_BUILD_RESULT: ${{ needs['image-build'].result }}
        run: |
          if [[ "$CHECKS_RESULT" != success || "$IMAGE_BUILD_RESULT" != success ]]; then
            echo "Frontend PR checks: $CHECKS_RESULT; image build: $IMAGE_BUILD_RESULT" >&2
            exit 1
          fi
